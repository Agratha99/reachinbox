services:
  # 1. Express Backend Web Service
  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Next.js Frontend Web Service
  - type: web
    name: reachinbox-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url

databases:
  # 3. PostgreSQL Managed Database
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
