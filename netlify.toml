[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18.17.0"

# Redirect API calls to the backend service (Render/Railway/EC2)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api-url.onrender.com/api/:splat"
  status = 200
  force = true
